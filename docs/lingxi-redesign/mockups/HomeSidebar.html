<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Library home: sidebar and list</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,500;7..72,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#7cc4a8}a:hover{color:#a3dcc5}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:#b5bbbe;text-decoration:none;font-size:14px;font-weight:600}
.nav:hover{background:#25292a}
.row{display:grid;grid-template-columns:44px minmax(0,1fr) 180px 110px 100px 92px;align-items:center;gap:16px;padding:12px 16px;border-bottom:1px solid #272b2c}
.th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#8f9699;font-weight:700}
.thumb{width:44px;height:60px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:Literata,serif;font-size:18px}
.bar{height:4px;border-radius:2px;background:#33383a;overflow:hidden}
.act{width:40px;height:40px;border-radius:50%;border:1px solid #3a3f41;background:transparent;color:#e4e6e7;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.ib{width:40px;height:40px;border:0;background:transparent;color:#9aa0a3;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; background: #1b1d1e; color: #e4e6e7; font-family: Manrope, sans-serif; display: flex;">
  <nav aria-label="Main" style="width: 240px; flex-shrink: 0; background: #181a1b; border-right: 1px solid #2a2e2f; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; padding: 0 12px 20px;"><span style="color: #7cc4a8;">灵</span>Lingxi</div>
    <a class="nav" href="#" style="background: #263b33; color: #cfeee0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V5a2 2 0 012-2h12v18H6a2 2 0 01-2-2zM8 7h6"/></svg>Library</a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 14v-2a8 8 0 0116 0v2"/><rect x="3" y="14" width="5" height="6" rx="1.5"/><rect x="16" y="14" width="5" height="6" rx="1.5"/></svg>Listening</a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Downloads</a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 4h14v16l-7-4-7 4z"/></svg>Bookmarks</a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a3 3 0 00-3 3v6a3 3 0 006 0V6a3 3 0 00-3-3zM5 11a7 7 0 0014 0M12 18v3"/></svg>Voices</a>
    <div style="flex: 1;"></div>
    <div style="padding: 12px; border-radius: 10px; background: #202324; display: flex; flex-direction: column; gap: 8px;">
      <div style="font-size: 12px; color: #9aa0a3;">Offline storage</div>
      <div class="bar"><div style="width: 18%; height: 100%; background: #7cc4a8;"></div></div>
      <div style="font-size: 12px; color: #c9cdcf;">[USED] of [AVAILABLE]</div>
    </div>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
  </nav>

  <main style="flex: 1; min-width: 0; padding: 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px;">
    <div style="display: flex; align-items: center; gap: 12px;">
      <h1 style="margin: 0; font-size: 24px; flex-grow: 1;">Library</h1>
      <label style="display: flex; align-items: center; gap: 8px; width: 260px; height: 40px; border: 1px solid #33383a; border-radius: 10px; padding: 0 12px; box-sizing: border-box; color: #8f9699;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input aria-label="Search library" placeholder="Search" style="flex: 1; border: 0; background: transparent; color: #e4e6e7; font: 500 13px Manrope, sans-serif; outline: none;">
      </label>
      <button class="ib" aria-label="Grid view"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="4" y="4" width="7" height="7"/><rect x="13" y="4" width="7" height="7"/><rect x="4" y="13" width="7" height="7"/><rect x="13" y="13" width="7" height="7"/></svg></button>
      <button class="ib" aria-label="List view" style="background: #2f3436; color: #fff;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      <button style="height: 40px; border: 0; border-radius: 10px; background: #7cc4a8; color: #11241c; font: 700 13px Manrope, sans-serif; padding: 0 16px; display: flex; align-items: center; gap: 6px; cursor: pointer;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add</button>
    </div>

    <div style="border: 1px solid #2a2e2f; border-radius: 14px; overflow: hidden; background: #1e2122;">
      <div class="row" style="padding-top: 10px; padding-bottom: 10px; background: #202324;">
        <span></span><span class="th">Title</span><span class="th">Progress</span><span class="th">Length</span><span class="th">Opened</span><span></span>
      </div>
      <div class="row">
        <div class="thumb" style="background: #2c4a3f; color: #a3dcc5;">天</div>
        <div style="min-width: 0;"><div style="font-size: 14px; font-weight: 600;">Library of Heaven's Path 1-100</div><div style="font-size: 12px; color: #9aa0a3; margin-top: 3px;">PDF · Chapter 1 · Swindler</div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="bar" style="flex: 1;"><div style="width: 2%; height: 100%; background: #7cc4a8;"></div></div><span style="font-size: 12px; color: #9aa0a3; width: 30px;">1%</span></div>
        <span style="font-size: 13px; color: #c9cdcf;">665 pages</span>
        <span style="font-size: 13px; color: #9aa0a3;">6m ago</span>
        <div style="display: flex; gap: 6px;">
          <button class="act" aria-label="Resume listening" style="background: #7cc4a8; border-color: #7cc4a8; color: #11241c;"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg></button>
          <button class="ib" aria-label="More options"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
        </div>
      </div>
      <div class="row" style="border-bottom: 0;">
        <div class="thumb" style="background: #3a3448; color: #cbbef0;">¶</div>
        <div style="min-width: 0;"><div style="font-size: 14px; font-weight: 600;">Pagination test</div><div style="font-size: 12px; color: #9aa0a3; margin-top: 3px;">Text · not started</div></div>
        <div style="display: flex; align-items: center; gap: 10px;"><div class="bar" style="flex: 1;"></div><span style="font-size: 12px; color: #9aa0a3; width: 30px;">0%</span></div>
        <span style="font-size: 13px; color: #c9cdcf;">~13 min</span>
        <span style="font-size: 13px; color: #9aa0a3;">2m ago</span>
        <div style="display: flex; gap: 6px;">
          <button class="act" aria-label="Start listening"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 5v14l12-7z"/></svg></button>
          <button class="ib" aria-label="More options"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
        </div>
      </div>
    </div>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>

}
</script>
</body>
</html>
