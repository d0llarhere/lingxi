<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Settings: appearance</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
.nav{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px;color:#b5bbbe;text-decoration:none;font-size:14px;font-weight:600}
.sn{display:block;height:36px;line-height:36px;padding:0 12px;border-radius:8px;color:#a9afb2;text-decoration:none;font-size:14px;font-weight:600}
.cap{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#8f9699}
.card{border:1px solid #2e3233;border-radius:14px;background:#202324;overflow:hidden}
.r{display:flex;align-items:center;gap:16px;padding:10px 18px;min-height:56px;box-sizing:border-box}
.l{flex:1;font-size:14px;font-weight:600}
.h{display:block;font-size:12px;font-weight:500;color:#9aa0a3;margin-top:2px}
.seg{display:flex;gap:3px;background:#1a1c1d;border-radius:9px;padding:3px}
.sb{height:30px;border:0;border-radius:7px;background:transparent;color:#b5bbbe;font:600 12px Manrope,sans-serif;padding:0 11px;cursor:pointer}
.on{background:#33383a;color:#fff}
.th{border:2px solid #2e3233;border-radius:12px;background:transparent;padding:6px;display:flex;flex-direction:column;gap:8px;cursor:pointer;font:600 13px Manrope,sans-serif;color:#e4e6e7;text-align:left}
.pv{height:84px;border-radius:7px;display:flex;overflow:hidden}
.sw{width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
</style>
</helmet>
<div style="width: 1280px; height: 800px; overflow: hidden; background: #1b1d1e; color: #e4e6e7; font-family: Manrope, sans-serif; display: flex;">
  <nav aria-label="Main" style="width: 240px; flex-shrink: 0; background: #181a1b; border-right: 1px solid #2a2e2f; padding: 20px 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 4px;">
    <div style="display: flex; align-items: center; gap: 8px; font-size: 19px; font-weight: 700; padding: 0 12px 20px;"><span style="color: #7cc4a8;">灵</span>Lingxi</div>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 19V5a2 2 0 012-2h12v18H6a2 2 0 01-2-2zM8 7h6"/></svg>Library</a>
    <a class="nav" href="#"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>Downloads</a>
    <div style="flex: 1;"></div>
    <a class="nav" href="#" style="background: #263b33; color: #cfeee0;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19 12a7 7 0 00-.1-1.2l2-1.6-2-3.4-2.4 1a7 7 0 00-2-1.2L14 3h-4l-.5 2.6a7 7 0 00-2 1.2l-2.4-1-2 3.4 2 1.6a7 7 0 000 2.4l-2 1.6 2 3.4 2.4-1a7 7 0 002 1.2L10 21h4l.5-2.6a7 7 0 002-1.2l2.4 1 2-3.4-2-1.6c.1-.4.1-.8.1-1.2z"/></svg>Settings</a>
  </nav>
  <div style="flex: 1; min-width: 0; display: flex; gap: 40px; padding: 36px 48px; box-sizing: border-box;">
    <nav aria-label="Settings sections" style="width: 180px; flex-shrink: 0; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 22px; font-weight: 700; padding: 0 12px 18px;">Settings</div>
      <a class="sn" href="#">Reading</a>
      <a class="sn" href="#">Listening</a>
      <a class="sn" href="#">Chapters</a>
      <a class="sn" href="#">Storage</a>
      <a class="sn" href="#" style="background: #25292a; color: #fff;">Appearance</a>
      <a class="sn" href="#">About</a>
    </nav>
    <main style="flex: 1; max-width: 680px; display: flex; flex-direction: column; gap: 18px;">
      <div>
        <h1 style="margin: 0; font-size: 26px;">Appearance</h1>
        <p style="margin: 8px 0 0; font-size: 14px; color: #a9afb2;">Theme and colors for the whole app.</p>
      </div>

      <span class="cap">Theme</span>
      <div role="radiogroup" aria-label="Theme" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px;">
        <button class="th" role="radio" aria-checked="false">
          <span class="pv"><span style="flex: 1; background: #f6f5f1; padding: 10px; display: flex; flex-direction: column; gap: 5px;"><span style="height: 5px; width: 70%; border-radius: 3px; background: #c9c6bd;"></span><span style="height: 5px; width: 90%; border-radius: 3px; background: #dcd9d0;"></span></span><span style="flex: 1; background: #1b1d1e; padding: 10px; display: flex; flex-direction: column; gap: 5px;"><span style="height: 5px; width: 70%; border-radius: 3px; background: #4a4f51;"></span><span style="height: 5px; width: 90%; border-radius: 3px; background: #3a3f41;"></span></span></span>
          <span style="padding: 0 4px 2px;">System</span>
        </button>
        <button class="th" role="radio" aria-checked="false">
          <span class="pv" style="background: #f6f5f1; padding: 10px; flex-direction: column; gap: 5px; box-sizing: border-box;"><span style="height: 5px; width: 60%; border-radius: 3px; background: #c9c6bd;"></span><span style="height: 5px; width: 90%; border-radius: 3px; background: #dcd9d0;"></span><span style="height: 5px; width: 80%; border-radius: 3px; background: #dcd9d0;"></span><span style="margin-top: auto; height: 14px; width: 50%; border-radius: 999px; background: #3f8f72;"></span></span>
          <span style="padding: 0 4px 2px;">Light</span>
        </button>
        <button class="th" role="radio" aria-checked="true" style="border-color: #7cc4a8;">
          <span class="pv" style="background: #1b1d1e; padding: 10px; flex-direction: column; gap: 5px; box-sizing: border-box; border: 1px solid #2e3233;"><span style="height: 5px; width: 60%; border-radius: 3px; background: #4a4f51;"></span><span style="height: 5px; width: 90%; border-radius: 3px; background: #3a3f41;"></span><span style="height: 5px; width: 80%; border-radius: 3px; background: #3a3f41;"></span><span style="margin-top: auto; height: 14px; width: 50%; border-radius: 999px; background: #7cc4a8;"></span></span>
          <span style="padding: 0 4px 2px; display: flex; justify-content: space-between; align-items: center;">Dark<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7cc4a8" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></span>
        </button>
        <button class="th" role="radio" aria-checked="false">
          <span class="pv" style="background: #f1e7d0; padding: 10px; flex-direction: column; gap: 5px; box-sizing: border-box;"><span style="height: 5px; width: 60%; border-radius: 3px; background: #cdbd99;"></span><span style="height: 5px; width: 90%; border-radius: 3px; background: #ddd0b1;"></span><span style="height: 5px; width: 80%; border-radius: 3px; background: #ddd0b1;"></span><span style="margin-top: auto; height: 14px; width: 50%; border-radius: 999px; background: #8a6a3b;"></span></span>
          <span style="padding: 0 4px 2px;">Sepia</span>
        </button>
      </div>

      <span class="cap">Accent color</span>
      <div class="card">
        <div class="r">
          <div role="radiogroup" aria-label="Accent color" style="display: flex; gap: 12px; flex: 1;">
            <button class="sw" role="radio" aria-checked="true" aria-label="Jade" style="background: #7cc4a8; box-shadow: 0 0 0 3px #202324, 0 0 0 5px #7cc4a8;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#11241c" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg></button>
            <button class="sw" role="radio" aria-checked="false" aria-label="Sky" style="background: #8fb4e8;"></button>
            <button class="sw" role="radio" aria-checked="false" aria-label="Amber" style="background: #e8c98a;"></button>
            <button class="sw" role="radio" aria-checked="false" aria-label="Rose" style="background: #e8a3b0;"></button>
            <button class="sw" role="radio" aria-checked="false" aria-label="Lavender" style="background: #c3b4f0;"></button>
          </div>
          <span style="font-size: 13px; color: #a9afb2;">Jade</span>
        </div>
      </div>

      <span class="cap">Motion</span>
      <div class="card">
        <div class="r"><span class="l">Reduce motion<span class="h">Turns off pill and menu animations</span></span><div class="seg"><button class="sb on">Follow system</button><button class="sb">On</button><button class="sb">Off</button></div></div>
      </div>
    </main>
  </div>
</div>
</x-dc>

</body>
</html>
